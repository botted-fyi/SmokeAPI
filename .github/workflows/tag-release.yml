name: '🏷️ Tag Release'

on:
  push:
    tags:
      - '*'

jobs:
  build-binaries:
    name: '🏗️ Build Binaries'
    uses: ./.github/workflows/matrix-build.yml

  create-release:
    name: '📦 Create Release'
    uses: acidicoala/KoalaBox/.github/workflows/create-release.yml@997b5db2ee75beec83c674e247e64afa2832aa14
    needs: build-binaries
    permissions:
      contents: write
    with:
      zip_files: >
        res/README.txt
        res/SmokeAPI.config.json
